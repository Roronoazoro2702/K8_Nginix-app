{{- if .Values.rbac.create -}}
# Security Issue: Using ClusterRole (cluster-wide) instead of Role (namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "insecure-app.fullname" . }}
  labels:
    {{- include "insecure-app.labels" . | nindent 4 }}
rules:
  # Security Issue: Overly permissive RBAC with wildcard permissions
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insecure-app.fullname" . }}
  labels:
    {{- include "insecure-app.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "insecure-app.fullname" . }}
  labels:
    {{- include "insecure-app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "insecure-app.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "insecure-app.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}