{{- if .Values.adminDashboard.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insecure-app.fullname" . }}-admin
  labels:
    {{- include "insecure-app.labels" . | nindent 4 }}
  annotations:
    # Security Issue: No IP whitelisting for admin dashboard
    {{- with .Values.adminDashboard.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Security Issue: Not enforcing TLS
    # kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Release.Name }}.example.com
      http:
        paths:
          - path: {{ .Values.adminDashboard.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "insecure-app.fullname" . }}
                port:
                  name: admin
  # Security Issue: Not enabling TLS
  # tls:
  #  - secretName: {{ include "insecure-app.fullname" . }}-tls
  #    hosts:
  #      - {{ .Release.Name }}.example.com
{{- end -}}